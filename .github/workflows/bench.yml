name: Bench

# Report-only (docs/benchmark.md §5: the gate enforces after two report-only
# releases, and it enforces in the SCANNER repo's CI, not here).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The released scanner, not a build: this workflow measures the corpus
      # against what users actually have.
      - name: Install airom
        run: pip install airom
      # `airom bench` ships in the release after v0.4.1. Until PyPI carries
      # it, skip with a notice instead of failing: "the released scanner
      # predates the corpus" is a fact, not a breakage.
      - name: Run the benchmark
        run: |
          if ! airom bench --help >/dev/null 2>&1; then
            echo "::notice::installed airom $(airom --version) has no bench command yet; skipping until the next release"
            echo "skipped: released airom predates the corpus" > "$GITHUB_STEP_SUMMARY"
            touch bench.json
            exit 0
          fi
          airom bench . --json bench.json | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench.json
