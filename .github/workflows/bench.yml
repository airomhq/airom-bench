name: Bench

# Report-only (docs/benchmark.md §5: the gate enforces after two report-only
# releases, and it enforces in the SCANNER repo's CI, not here).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The released scanner, not a build: this workflow measures the corpus
      # against what users actually have.
      - name: Install airom
        run: pip install airom
      # `airom bench` ships in the release after v0.4.1. Until PyPI carries
      # it, skip with a notice instead of failing: "the released scanner
      # predates the corpus" is a fact, not a breakage.
      # This workflow publishes what the RELEASED scanner scores on this
      # corpus. A released scanner that cannot run is real information and
      # goes in the summary, but it is not a defect in this repository, so it
      # does not turn the corpus red. Anything this repo does control — a
      # malformed truth.yaml, a corrupt snapshot — still fails, because
      # `airom bench` exits nonzero for those too and the summary says which.
      - name: Run the benchmark
        run: |
          ver=$(airom --version 2>/dev/null || echo "unknown")
          if ! airom bench --help >/dev/null 2>&1; then
            echo "::notice::$ver has no bench command yet; skipping until the next release"
            echo "skipped: released airom predates the corpus" > "$GITHUB_STEP_SUMMARY"
            touch bench.json
            exit 0
          fi
          if airom bench . --json bench.json > report.md 2>err.txt; then
            cat report.md | tee "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Benchmark did not run"
            echo
            echo "Scanner: \`$ver\`"
            echo
            echo '```'
            cat err.txt
            echo '```'
            echo
            echo "The released scanner could not evaluate this corpus. That is"
            echo "reported here rather than failing, because it is a scanner"
            echo "defect, not a corpus one. Known: v0.4.2 refuses GitHub"
            echo "tarballs (pax_global_header); fixed on airom main."
          } | tee "$GITHUB_STEP_SUMMARY"
          echo "::warning::$ver could not evaluate the corpus; see the job summary"
          touch bench.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench.json
