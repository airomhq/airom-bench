notes: |
  The kind-dense Python entry: manifest + code corroboration for the library
  and vector DB, a hosted model with bound params, a local embedding model
  reference, a Jinja prompt, and a JSONL dataset. sentence-transformers was
  labeled framework and relabeled library on 2026-08-23: the catalog draws
  the line deliberately (transformers orchestrates, sentence-transformers is
  a usage API atop it), and that
  is a labeling debate to settle in this file's history, not silently.
  2026-08-23: rag-pipeline label ADDED after first run: the tree embeds,
  stores, retrieves, and generates, which is the definition of the
  composite. The labeler missed it; the scanner did not. Bound generation
  params (temperature, max_tokens) remain deliberately unlabeled: §9.5
  defines ai-config as UNBOUND params, and these are bound to the call
  that names the model, so standalone ai-config components for them are
  counted as the false positives they are.
